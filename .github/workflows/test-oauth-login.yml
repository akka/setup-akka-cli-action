name: Test OAuth workload identity login

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-oauth-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Akka CLI (self)
        uses: ./
        with:
          oauth-provider-organization-id: 1b413cae-993d-43e2-862b-0405e8439520
          oauth-provider-name: github
          api-server-host: api.kalix.st:443

      - name: Verify current login
        run: |
          set -euo pipefail
          output=$(akka auth current-login -o json)
          echo "$output"
          echo "$output" | grep -F 'organizations/1b413cae-993d-43e2-862b-0405e8439520/identityproviders/github/subject/akka%2Fsetup-akka-cli-action'
          echo "$output" | grep -F 'organizations/1b413cae-993d-43e2-862b-0405e8439520/identityproviders/github/claims/repository_owner/akka'
